services:
  certiflow-local-db:
    image: postgres:16
    container_name: certiflow-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: certiflow_local_db
      POSTGRES_USER: certiflow_local_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - certiflow_local_pgdata:/var/lib/postgresql/data

volumes:
  certiflow_local_pgdata: